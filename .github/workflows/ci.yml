name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: appbuilder
          POSTGRES_PASSWORD: appbuilder
          POSTGRES_DB: appbuilder
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U appbuilder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # CI-only values for a throwaway database – not secrets.
    env:
      DATABASE_URL: postgres://appbuilder:appbuilder@localhost:5432/appbuilder
      TEST_DATABASE_URL: postgres://appbuilder:appbuilder@localhost:5432/appbuilder_test
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-not-used-anywhere-else
      BETTER_AUTH_URL: http://localhost:3000
      ROOT_DOMAIN: localhost
      AI_PROVIDER: mock
      PAYMENT_PROVIDER: dev
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create test database
        run: PGPASSWORD=appbuilder psql -h localhost -U appbuilder -d appbuilder -c "CREATE DATABASE appbuilder_test"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Apply migrations
        run: npm run db:migrate

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
